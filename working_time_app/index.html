<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務時間計算</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>勤務時間計算</h1>
        <div class="input-card">
            <div class="input-group">
                <label for="startTime">開始時刻 (例: 0900)</label>
                <input type="text" id="startTime" maxlength="4" placeholder="0900">
            </div>
            <div class="input-group">
                <label for="endTime">終了時刻 (例: 1800)</label>
                <input type="text" id="endTime" maxlength="4" placeholder="1800">
            </div>
            <div class="input-group">
                <label for="breakTime">休憩時間 (分) (例: 60)</label>
                <input type="text" id="breakTime" placeholder="60">
            </div>
            <div class="input-group">
                <label for="cumulativeOvertime">前日までの累積残業時間 (分) (例: 120)</label>
                <input type="text" id="cumulativeOvertime" placeholder="0">
            </div>
            <button id="calculateButton">計算</button>
            <div id="errorMessage" class="error-message"></div>
            <div class="results">
                <p>勤務時間 (時間形式): <span id="resultHoursMinutes">--時間 --分</span></p>
                <p>勤務時間 (数値形式): <span id="resultDecimalHours">--.--時間</span></p>
                <p>本日の残業時間: <span id="todayOvertime">--時間 --分</span></p>
                <p>合計残業時間: <span id="totalCumulativeOvertime">--時間 --分</span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
