<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務時間計算</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <h1>勤務時間計算</h1>
        <div class="input-card">
            <div class="input-group">
                <label for="startTime">開始時刻 (例: 0900)</label>
                <input type="text" id="startTime" maxlength="4" placeholder="0900">
            </div>
            <div class="input-group">
                <label for="endTime">終了時刻 (例: 1800)</label>
                <input type="text" id="endTime" maxlength="4" placeholder="1800">
            </div>
            <div class="input-group">
                <label for="breakTime">休憩時間 (例: 0060)</label>
                <input type="text" id="breakTime" maxlength="4" placeholder="0060">
            </div>
            <div class="input-group">
                <label for="cumulativeOvertime">前日までの累積残業時間 (例: 0120)</label>
                <input type="text" id="cumulativeOvertime" maxlength="4" placeholder="0120">
            </div>
            <button id="calculateButton" type="button">計算</button>
            <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>
            <div class="results">
                <p>累積残業時間: <span id="totalCumulativeOvertime">--時間 --分</span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
